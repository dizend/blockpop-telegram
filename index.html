<html lang="ru">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БлокПоп!</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { width:100%; height:100%; overflow:hidden; background:#231a3f; }
  body { font-family:'Arial Rounded MT Bold','Helvetica Rounded',Arial,system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,#2e2154 0%,#231a3f 55%,#1b1430 100%); }
  #hud { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; padding:10px 12px 4px; gap:8px; z-index:5; }
  .pill { background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.14); border-radius:16px; padding:5px 12px; text-align:center; min-width:86px; }
  .pill .lbl { font-size:10px; letter-spacing:1px; color:#b7a8e8; text-transform:uppercase; }
  .pill .val { font-size:19px; font-weight:bold; color:#fff; line-height:1.1; }
  #btnPause { width:44px; height:44px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  #cv { display:block; touch-action:none; z-index:1; }
  #btnSkip { position:absolute; z-index:6; width:46px; height:46px; border-radius:15px; border:2px solid rgba(255,255,255,.20);
             background:rgba(255,255,255,.10); color:#fff; font-size:20px; cursor:pointer; font-family:inherit; font-weight:bold; }
  #btnSkip.cool { opacity:.35; }
  #btnSkip:active:not(.cool) { transform:scale(.92); }
  .ic { width:1.05em; height:1.05em; display:inline-block; vertical-align:-0.15em; fill:currentColor; }
  .btn .ic { margin-right:6px; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .spinner { width:.85em; height:.85em; border:2.5px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; display:inline-block; vertical-align:-0.08em; animation:rot .8s linear infinite; }
  .btn:disabled { opacity:.65; }
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(24,16,45,.90); backdrop-filter:blur(6px); padding:24px; text-align:center; }
  .hidden { display:none !important; }
  .logo { font-size:min(13vw,58px); font-weight:bold; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.35); letter-spacing:1px; }
  .logo .c1{color:#ff6b6b}.logo .c2{color:#ffb84d}.logo .c3{color:#ffe14d}.logo .c4{color:#6bd96b}.logo .c5{color:#5ec8ff}.logo .c6{color:#c39bff}
  .sub { color:#b7a8e8; font-size:15px; max-width:320px; line-height:1.45; }
  .btn { appearance:none; border:none; cursor:pointer; border-radius:20px; padding:14px 34px; font-size:20px; font-weight:bold; color:#fff; font-family:inherit;
         background:linear-gradient(180deg,#ff9d4d,#ff6b3d); box-shadow:0 5px 0 #c74a24, 0 8px 16px rgba(0,0,0,.35); transition:transform .06s; min-width:220px; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #c74a24; }
  .btn.blue { background:linear-gradient(180deg,#5ec8ff,#3d8bff); box-shadow:0 5px 0 #2456b8, 0 8px 16px rgba(0,0,0,.35); }
  .btn.blue:active { box-shadow:0 2px 0 #2456b8; }
  .btn.green { background:linear-gradient(180deg,#7ee06b,#3fbf4d); box-shadow:0 5px 0 #23803a, 0 8px 16px rgba(0,0,0,.35); }
  .btn.green:active { box-shadow:0 2px 0 #23803a; }
  .btn.ghost { background:rgba(255,255,255,.10); box-shadow:none; border:2px solid rgba(255,255,255,.22); font-size:16px; padding:10px 22px; min-width:0; }
  .toggles { display:flex; gap:12px; }
  .tgl { width:56px; height:56px; border-radius:18px; border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); font-size:24px; cursor:pointer; color:#fff; }
  .tgl.off { opacity:.38; filter:grayscale(1); }
  .bigscore { font-size:52px; font-weight:bold; color:#ffe14d; text-shadow:0 3px 0 rgba(0,0,0,.4); line-height:1; }
  .overttl { font-size:min(11vw,44px); font-weight:bold; color:#ff6b6b; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  .best { color:#b7a8e8; font-size:16px; }
  .newrec { color:#ffe14d; font-size:18px; font-weight:bold; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  #userHello { color:#8f7fc9; font-size:13px; }
  .toptabs { display:flex; gap:8px; }
  .toptab { border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#b7a8e8; border-radius:14px; padding:8px 18px; font-size:15px; font-weight:bold; cursor:pointer; font-family:inherit; }
  .toptab.on { color:#fff; border-color:#ffe14d; background:rgba(255,225,77,.12); }
  #topList { width:100%; max-width:360px; display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow-y:auto; }
  .toprow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.10); border-radius:14px; padding:8px 12px; }
  .toprow.me { border-color:#ffe14d; background:rgba(255,225,77,.10); }
  .toprow .rk { width:28px; text-align:center; font-weight:bold; color:#b7a8e8; flex:none; }
  .toprow .rk.gold { color:#ffe14d; } .toprow .rk.silv { color:#cfd8e3; } .toprow .rk.brnz { color:#e8a06b; }
  .toprow .nm { flex:1; color:#fff; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .toprow .gm { color:#ffe14d; font-weight:bold; flex:none; }
  .toprow .wn { color:#8f7fc9; font-size:12px; flex:none; }
  .toprow .gm.neg { color:#ff8a80; }
  .toprow .gm.zero { color:#8f7fc9; }
  .gemfall { position:fixed; top:-48px; z-index:40; pointer-events:none; animation:gfall linear forwards; }
  @keyframes gfall { to { transform:translateY(115vh) rotate(600deg); opacity:.9; } }
</style>

<script>
'use strict';
/* ============================================================
   БлокПоп! — Telegram Mini App edition
   Один самодостаточный файл. Canvas + WebAudio.
   ============================================================ */

// ---------- Telegram Mini App integration ----------
var TG_BOT_URL = 'https://t.me/BlockPopGameBot/play'; // ссылка мини-аппа (кнопка «Поделиться»)
var SCORE_API = 'https://blockpop-bot.dizend.workers.dev/score'; // воркер лидерборда

// Контекст «игры из чата» (Games API): подписанные параметры из URL
var GAME_CTX = null;
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('sig') && q.get('u') && q.get('ts')) {
      GAME_CTX = { u:q.get('u'), im:q.get('im')||'', c:q.get('c')||'', m:q.get('m')||'', ts:q.get('ts'), sig:q.get('sig') };
    }
  } catch(e){}
})();
function submitScore(s){
  if (!GAME_CTX || !SCORE_API) return;
  var el = document.getElementById('scoreSent');
  if (el){ el.textContent = 'Отправляю результат…'; el.classList.remove('hidden'); }
  try {
    fetch(SCORE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // без preflight
      body: JSON.stringify({ score:s, dur: Date.now()-gameStartTs, moves: dropsCount, u:GAME_CTX.u, im:GAME_CTX.im, c:GAME_CTX.c, m:GAME_CTX.m, ts:GAME_CTX.ts, sig:GAME_CTX.sig })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!el) return;

// ---------- Слияния ----------
function findMergeGroup(){
  // ищем лучшую группу: связная область одинаковых значений (4-направления), size>=2
  var seen = {};
  var bestG = null;
  for (var c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
    var b = grid[c][r]; if (!b) continue;
    var key = c+','+r; if (seen[key]) continue;
    // BFS
    var q=[[c,r]], g=[], v=b.v; seen[key]=1;
    while(q.length){
      var cur=q.pop(), cc=cur[0], rr=cur[1];
      var bb=grid[cc][rr]; if(!bb||bb.v!==v) continue;
      g.push(bb);
      var nb=[[cc-1,rr],[cc+1,rr],[cc,rr-1],[cc,rr+1]];
      for(var i=0;i<nb.length;i++){
        var nc=nb[i][0], nr=nb[i][1];
        if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
        var k2=nc+','+nr; if(seen[k2]) continue;
        var b2=grid[nc][nr];
        if(b2 && b2.v===v){ seen[k2]=1; q.push([nc,nr]); }
      }
    }
    if (g.length>=2){
      if (!bestG || g.length>bestG.length) bestG = g;
    }
  }
  return bestG;
}
function doMerge(group){
  // цель — последний двигавшийся блок группы
  var target = group[0];
  for (var i=1;i<group.length;i++) if (group[i].tick > target.tick) target = group[i];
  var newV = target.v * Math.pow(2, group.length-1);
  combo++;
  var gained = newV * combo;
  score += gained;
  // убрать остальных
  for (var j=0;j<group.length;j++){
    var b = group[j];
    if (b===target) continue;
    grid[b.col][b.row] = null;
    blocks.splice(blocks.indexOf(b),1);
    burst(cellX(b.col)+cell/2, b.y+cell/2, colorFor(b.v)[1], 10);
  }
  target.v = newV; target.pop = 1; target.tick = ++moveTick;
  floaters.push({x:cellX(target.col)+cell/2, y:target.y, txt:'+'+gained, t:0, col:'#ffe14d'});
  if (combo>1) floaters.push({x:W/2, y:boardY-10, txt:'КОМБО x'+combo+'!', t:0, col:'#5ec8ff', big:1});
  sfxMerge(newV, combo); if (combo>1) sfxCombo(combo);
  haptic('merge');
  checkMilestone(newV);
  applyGravity();
  updateHud();
}
function checkMilestone(v){
  if ((v===512||v===1024||v===2048||v===4096) && !milestones[v]){
    milestones[v]=1;
    var thr = v===512?2 : v===1024?4 : v===2048?8 : 16;
    var boomed=0;
    for (var c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
      var b=grid[c][r];
      if (b && b.v<=thr){
        grid[c][r]=null; blocks.splice(blocks.indexOf(b),1);
        burst(cellX(c)+cell/2, b.y+cell/2, colorFor(b.v)[0], 14);
        boomed++;
      }
    }
    if (boomed>0){ score += boomed*thr*2; }
    bannerTxt = 'БУМ! ' + v + '!'; bannerT = 90; shakeT = 14;
    sfxBoom(); haptic('boom');
    // младшие блоки уходят и из очереди выдачи (в дуэли колода фиксирована)
    if (!duelActive){
      var minV = minSpawnV();
      for (var qi=0; qi<nextQ.length; qi++) if (nextQ[qi] < minV) nextQ[qi] = minV;
    }
    applyGravity();
  }
}
function applyGravity(){
  for (var c=0;c<COLS;c++){
    var stack=[];
    for (var r=0;r<ROWS;r++) if (grid[c][r]) stack.push(grid[c][r]);
    for (r=0;r<ROWS;r++) grid[c][r]=null;
    for (var i=0;i<stack.length;i++){
      var b=stack[i];
      if (b.row!==i) b.tick = ++moveTick;
      b.row=i; grid[c][i]=b;
      b.targetY = cellY(i);
    }
  }
}
function allSettled(){
  for (var i=0;i<blocks.length;i++){ if (Math.abs(blocks[i].y - blocks[i].targetY) > 0.5) return false; }

// ---------- Частицы и эффекты ----------
function burst(x,y,color,n){
  for (var i=0;i<n;i++){
    var a=Math.random()*6.283, s=1.5+Math.random()*3.5;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,t:0,life:30+Math.random()*20,color:color,r:2+Math.random()*3});
  }
}

// ---------- Отрисовка ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBlock(x,y,v,scale,popped){
  var pad = cell*0.055, s = cell - pad*2;
  var cx = x+cell/2, cy = y+cell/2;
  var sc = scale || 1;
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-cx,-cy);
  var cols = colorFor(v);
  // тень
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  rr(x+pad, y+pad+s*0.06, s, s, s*0.24); ctx.fill();
  // корпус
  var g = ctx.createLinearGradient(0,y,0,y+cell);
  g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  ctx.fillStyle = g;
  rr(x+pad, y+pad, s, s, s*0.24); ctx.fill();
  ctx.strokeStyle = cols[2]; ctx.lineWidth = Math.max(1.5, cell*0.035);
  rr(x+pad, y+pad, s, s, s*0.24); ctx.stroke();
  // блик
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  rr(x+pad+s*0.10, y+pad+s*0.08, s*0.8, s*0.28, s*0.14); ctx.fill();
  // глазки
  var ey = y+pad+s*0.42, ex1 = x+pad+s*0.30, ex2 = x+pad+s*0.70, er = Math.max(1.6, s*0.055);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex1,ey,er*1.8,0,6.283); ctx.arc(ex2,ey,er*1.8,0,6.283); ctx.fill();
  ctx.fillStyle = '#332';
  ctx.beginPath(); ctx.arc(ex1,ey+er*0.35,er,0,6.283); ctx.arc(ex2,ey+er*0.35,er,0,6.283); ctx.fill();
  // улыбка
  ctx.strokeStyle = 'rgba(40,20,20,.75)'; ctx.lineWidth = Math.max(1.4, s*0.04); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx, ey+er*1.2, s*0.16, 0.35, 2.79); ctx.stroke();
  // число
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(2, s*0.07);
  var fs = v>=1024 ? s*0.30 : v>=128 ? s*0.36 : s*0.42;
  ctx.font = 'bold ' + fs + 'px "Arial Rounded MT Bold", Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin = 'round';
  ctx.strokeText(String(v), cx, y+pad+s*0.80);
  ctx.fillText(String(v), cx, y+pad+s*0.80);
  ctx.restore();
}
var aimColGlow = 2;
function draw(){
  ctx.clearRect(0,0,W,H);
  var shx = 0, shy = 0;
  if (shakeT>0){ shakeT--; shx=(Math.random()-0.5)*shakeT*0.9; shy=(Math.random()-0.5)*shakeT*0.9; }
  ctx.save(); ctx.translate(shx,shy);

  // рамка поля
  ctx.fillStyle = 'rgba(255,255,255,.055)';
  rr(boardX-6, boardY-6, boardW+12, boardH+12, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth=2;
  rr(boardX-6, boardY-6, boardW+12, boardH+12, 18); ctx.stroke();

  // колонки
  for (var c=0;c<COLS;c++){
    if ((state==='aim') && curBlock && c===curBlock.col){
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      rr(cellX(c)+2, boardY-2, cell-4, boardH+4, 10); ctx.fill();
    }
  }
  // разметка: ячейки-слоты
  for (c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
    var inset = Math.max(2.5, cell*0.045);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    rr(boardX+c*cell+inset, boardY+r*cell+inset, cell-inset*2, cell-inset*2, cell*0.18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.lineWidth = 1.5;
    rr(boardX+c*cell+inset, boardY+r*cell+inset, cell-inset*2, cell-inset*2, cell*0.18);
    ctx.stroke();
  }

  // блоки
  for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    var sc = 1;
    if (b.pop>0){ sc = 1 + Math.sin(b.pop*3.1416)*0.22; b.pop -= 0.08; if (b.pop<0) b.pop=0; }
    drawBlock(cellX(b.col), b.y, b.v, sc);
  }

  // прицельный блок + следующий
  if (state==='aim' && curBlock){
    var tx = cellX(curBlock.col)+cell/2;
    curBlock.x += (tx-curBlock.x)*0.35;
    drawBlock(curBlock.x-cell/2, topZone-cell-4, curBlock.v, 1);
    // пунктир траектории
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2; ctx.setLineDash([4,7]);
    var landR = colHeight(curBlock.col);
    var endY = landR>=ROWS ? boardY : cellY(landR);
    ctx.beginPath(); ctx.moveTo(tx, topZone-2); ctx.lineTo(tx, endY); ctx.stroke();
    ctx.setLineDash([]);
    // очередь: следующий и за ним
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.font='11px Arial'; ctx.textAlign='center';
    ctx.fillText('след.', boardX+boardW-cell*0.55, topZone-cell-10);
    ctx.globalAlpha = 0.45;
    drawBlock(boardX+boardW-cell*1.35, topZone-cell*0.82, nextQ[1], 0.36);
    ctx.globalAlpha = 1;
    drawBlock(boardX+boardW-cell*0.92, topZone-cell*0.95, nextQ[0], 0.52);
  }
  // дуэльный HUD: остаток бросков и цель
  if (duelActive && (state==='aim'||state==='drop'||state==='resolve'||state==='pause')){
    ctx.fillStyle = '#ffe14d';
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.font = 'bold 15px "Arial Rounded MT Bold", Arial, sans-serif';
    ctx.textAlign = 'left';
    var dtxt = (duelKind === 'daily' ? 'Вызов дня · ' : duelKind === 'tour' ? 'Турнир · ' : '') + 'Броски: ' + (DUEL_DROPS_C - dropsCount);
    if (duelViewCache && duelViewCache.oppScore != null) dtxt += '   Цель: ' + (duelViewCache.oppScore + 1);
    if (duelViewCache && duelViewCache.tries > 1) dtxt += '   Попытка ' + duelViewCache.tries + '/' + (duelViewCache.triesMax || 3);
    ctx.strokeText(dtxt, boardX + cell*0.9, topZone - cell - 10);
    ctx.fillText(dtxt, boardX + cell*0.9, topZone - cell - 10);
  }
  // предупреждение: колонка почти полна
  if (state==='aim'||state==='drop'||state==='resolve'||state==='pause') for (c=0;c<COLS;c++){
    var hgt = colHeight(c);
    if (hgt>=ROWS-1){
      var pulse = 0.16 + 0.16*Math.abs(Math.sin(fcount*0.09));
      var gd = ctx.createLinearGradient(0, boardY, 0, boardY+cell*1.8);
      gd.addColorStop(0, 'rgba(255,60,60,'+(hgt>=ROWS?0.45:pulse)+')');
      gd.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = gd;
      rr(cellX(c)+2, boardY-2, cell-4, cell*1.8, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,80,80,'+(0.35+0.35*Math.abs(Math.sin(fcount*0.09)))+')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cellX(c)+4, boardY); ctx.lineTo(cellX(c)+cell-4, boardY); ctx.stroke();
    }
  }

  // частицы
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.t++; p.x+=p.vx; p.y+=p.vy; p.vy+=0.14;
    if (p.t>p.life){ particles.splice(i,1); continue; }
    ctx.globalAlpha = 1-(p.t/p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // всплывающий текст
  for (i=floaters.length-1;i>=0;i--){
    var f = floaters[i];
    f.t++; if (f.t>55){ floaters.splice(i,1); continue; }
    ctx.globalAlpha = f.t<45 ? 1 : (55-f.t)/10;
    ctx.fillStyle = f.col;
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.font = 'bold ' + (f.big? 24:17) + 'px "Arial Rounded MT Bold", Arial, sans-serif';
    ctx.textAlign='center';
    var yy = f.y - f.t*0.7;
    ctx.strokeText(f.txt, f.x, yy); ctx.fillText(f.txt, f.x, yy);
    ctx.globalAlpha=1;
  }
  // баннер
  if (bannerT>0){
    bannerT--;
    ctx.globalAlpha = Math.min(1, bannerT/20);
    ctx.fillStyle='#ffe14d'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=5; ctx.lineJoin='round';
    ctx.font='bold 34px "Arial Rounded MT Bold", Arial, sans-serif'; ctx.textAlign='center';
    ctx.strokeText(bannerTxt, W/2, boardY+boardH*0.4);
    ctx.fillText(bannerTxt, W/2, boardY+boardH*0.4);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ---------- Игровой цикл ----------
var resolveWait = 0;
function step(){
  fcount++;
  var sb = $('btnSkip');
  if (sb){
    var want = (state==='aim') ? 'block' : 'none';
    if (sb.style.display !== want) sb.style.display = want;
  }
  // физика падения (замирает на паузе)
  if (state!=='pause') for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    if (b.y < b.targetY){
      b.vy = (b.vy||0) + 1.6;
      b.y += b.vy;
      if (b.y >= b.targetY){ b.y = b.targetY; b.vy = 0; }
    } else if (b.y > b.targetY){
      b.y = b.targetY; b.vy = 0;
    }
  }
  if (state==='drop'){
    if (dropB && Math.abs(dropB.y-dropB.targetY)<0.5){
      sfxLand();
      dropB = null;
      state = 'resolve';
      resolveWait = 4;
    }
  } else if (state==='resolve'){
    if (allSettled()){
      if (resolveWait>0){ resolveWait--; }
      else {
        var g = findMergeGroup();
        if (g){ doMerge(g); resolveWait = 7; }
        else {
          combo = 0;
          if (duelActive && (dropsCount >= DUEL_DROPS_C || boardFull())){ duelFinish(); }
          else if (boardFull()){ gameOver(); }
          else { spawnCur(); state='aim'; }
        }
      }
    }
  }
  draw();
  requestAnimationFrame(step);
}

// ---------- Ввод ----------
function colFromX(px){
  var c = Math.floor((px - boardX)/cell);
  return Math.max(0, Math.min(COLS-1, c));
}
var pressCol = -1;
cv.addEventListener('pointerdown', function(e){
  audio();
  if (state!=='aim' || !curBlock) return;
  pressCol = colFromX(e.clientX - cv.getBoundingClientRect().left);
  curBlock.col = pressCol;
});

  if (state!=='aim' || !curBlock || pressCol<0) return;
  curBlock.col = colFromX(e.clientX - cv.getBoundingClientRect().left);
});

  if (state==='aim' && curBlock && pressCol>=0){

  }
  pressCol = -1;
});

  if (state==='aim' && curBlock){
    if (e.key==='ArrowLeft'){ curBlock.col = Math.max(0,curBlock.col-1); e.preventDefault(); }
    else if (e.key==='ArrowRight'){ curBlock.col = Math.min(COLS-1,curBlock.col+1); e.preventDefault(); }
    else if (e.key==='ArrowDown' || e.key===' '){ tryDrop(curBlock.col); e.preventDefault(); }
  }
  if (e.key==='p' || e.key==='P' || e.key==='Escape'){
    if (state==='pause') doResume(); else doPause();
  }
});

    refreshMe();

      duelUI({ title:'Дуэль', big: score, text: 'Не удалось отправить счёт. Проверь связь и попробуй снова.', start:'Отправить ещё раз' });
      $('btnDuelStart').onclick = null; // основной обработчик join не нужен
      duelRetry = payload;
      return;
    }
    duelRetry = null;
    duelViewCache = d.view || null;
    if (d.view && d.view.status === 'done') renderDuelDone(d.view);
    else renderDuelWait(d.view || { myScore: score });
  });
}
var duelRetry = null;
$('btnDuelStart').addEventListener('click', function(){

// ---------- Вызов дня ----------
var dailyState = null;
function showDailyScreen(){ hide('scrMenu'); hide('scrTop'); hide('scrDuel'); hide('scrOver'); hide('scrPause'); show('scrDaily'); if (state !== 'over') state = 'menu'; }
function updateDailyBadge(){
  var b = $('dailyBadge'); if (!b) return;
  var showB = dailyState && !dailyState.played && dailyState.tries < dailyState.triesMax;
  b.classList.toggle('hidden', !showB);
}
function renderDaily(){
  var d = dailyState;
  var info = $('dailyInfo'), big = $('dailyBig'), my = $('dailyMy'), list = $('dailyList'), play = $('btnDailyPlay');
  if (!d){
    info.innerHTML = '<span class="spinner"></span> Загружаю…';
    big.classList.add('hidden'); my.classList.add('hidden'); list.innerHTML = ''; play.classList.add('hidden');
    return;
  }
  var left = Math.max(0, d.endsAt - Date.now());
  var hh = Math.floor(left / 3600000), mm = Math.floor(left % 3600000 / 60000);
  play.disabled = false;
  play.innerHTML = '<svg class="ic"><use href="#i-play"/></svg>Играть';
  if (d.played){
    big.textContent = d.myScore; big.classList.remove('hidden');
    my.innerHTML = 'Твоё место сегодня: <b>#' + d.myRank + '</b> из ' + d.players; my.classList.remove('hidden');
    info.innerHTML = 'Сыграно! Новая колода через ' + hh + ' ч ' + mm + ' м.<br>Утром топ-10 дня получат кристаллы.';
    play.classList.add('hidden');
  } else if (d.tries >= d.triesMax){
    big.classList.add('hidden'); my.classList.add('hidden');
    info.textContent = 'Попытки на сегодня исчерпаны — возвращайся завтра за новой колодой!';
    play.classList.add('hidden');
  } else {
    big.classList.add('hidden'); my.classList.add('hidden');
    info.innerHTML = 'Одна колода на всех, одна попытка, ' + DUEL_DROPS_C + ' бросков.<br>Топ-10 дня получают кристаллы: 30/20/10 ' + IC_GEM + ' за пьедестал, 5 ' + IC_GEM + ' остальным.<br>До конца дня: ' + hh + ' ч ' + mm + ' м.' +
      (d.tries > 0 ? '<br><small style="opacity:.75">Это последняя попытка (вход ' + (d.tries + 1) + '/' + d.triesMax + ').</small>' : '');
    play.classList.remove('hidden');
  }
  list.innerHTML = '';
  if (!d.top || !d.top.length){
    list.innerHTML = '<div class="best">Сегодня ещё никто не сыграл — будь первым!</div>';
  } else {
    for (var i = 0; i < d.top.length; i++){
      var r = d.top[i];
      var div = document.createElement('div');
      div.className = 'toprow' + (r.user_id === d.myId ? ' me' : '');
      var rk = document.createElement('span');
      rk.className = 'rk' + (i === 0 ? ' gold' : i === 1 ? ' silv' : i === 2 ? ' brnz' : '');
      rk.textContent = i + 1;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name || 'Игрок';
      var gm = document.createElement('span'); gm.className = 'gm'; gm.textContent = r.score;
      div.appendChild(rk); div.appendChild(nm); div.appendChild(gm);
      list.appendChild(div);
    }
  }
}
function openDaily(){
  showDailyScreen();
  dailyState = null; renderDaily();
  wapi('/daily/state', null, function(d){
    dailyState = (d && d.ok) ? d : { played:false, tries:2, triesMax:2, top:[], players:0, endsAt:Date.now(), myId:0 };
    renderDaily(); updateDailyBadge();
  });
}
function checkDailyBadge(){
  if (!tg || !authPayload()) return;
  wapi('/daily/state', null, function(d){ if (d && d.ok){ dailyState = d; updateDailyBadge(); } });
}
function startDailyRound(seed){
  duelActive = true; duelKind = 'daily';
  duelSeedVal = seed; duelIdx = 0; duelViewCache = null;
  hide('scrDaily');
  startGame();
}
function dailyFinish(){
  showDailyScreen();
  $('dailyBig').textContent = score; $('dailyBig').classList.remove('hidden');
  $('dailyMy').classList.add('hidden'); $('dailyList').innerHTML = ''; $('btnDailyPlay').classList.add('hidden');
  $('dailyInfo').innerHTML = '<span class="spinner"></span> Отправляю результат…';
  wapi('/daily/score', { score: score, dur: Date.now() - gameStartTs, moves: dropsCount }, function(d){
    refreshMe();
    if (!d || !d.ok){
      $('dailyInfo').textContent = 'Не удалось отправить результат. Открой «Вызов дня» из меню и попробуй ещё раз.';

    dailyState = d; renderDaily(); updateDailyBadge();

$('btnDaily').addEventListener('click', function(){ audio(); sfxClick(); openDaily(); });
$('btnDailyMenu').addEventListener('click', function(){ sfxClick(); openMenu(); });
$('btnDailyPlay').addEventListener('click', function(){

    if (d && (d.error === 'attempts' || d.error === 'played')){ dailyState = d.state || dailyState; if (dailyState && d.error==='attempts') dailyState.tries = dailyState.triesMax; renderDaily(); updateDailyBadge(); }
    else $('dailyInfo').textContent = 'Не получилось войти. Проверь связь и попробуй ещё раз.';
  });
});
if (tg) $('btnDaily').classList.remove('hidden');

// ---------- Турнир ----------
var tourState = null;
function showTourScreen(){ hide('scrMenu'); hide('scrTop'); hide('scrDuel'); hide('scrDaily'); hide('scrOver'); hide('scrPause'); show('scrTour'); if (state !== 'over') state = 'menu'; }
function renderTour(){
  var v = tourState;
  var info = $('tourInfo'), big = $('tourBig'), list = $('tourList'), play = $('btnTourPlay');
  if (!v){ info.innerHTML = '<span class="spinner"></span> Загружаю…'; big.classList.add('hidden'); list.innerHTML = ''; play.classList.add('hidden'); return; }
  var left = Math.max(0, v.deadline - Date.now());
  var hh = Math.floor(left / 3600000), mm = Math.floor(left % 3600000 / 60000);
  var prizesTxt = (v.prizes && v.prizes.length) ? v.prizes.map(function(p, i){ return '#' + (i+1) + ': ' + p; }).join(' · ') + ' ' + IC_GEM : '';
  play.disabled = false;
  big.classList.add('hidden');
  if (v.status === 'cancelled'){
    info.textContent = 'Турнир не состоялся — ставки возвращены.'; play.classList.add('hidden');
  } else if (v.status === 'done'){
    var meP = v.me.joined && v.me.played;
    if (meP){ big.textContent = v.me.score; big.classList.remove('hidden'); }
    info.innerHTML = 'Турнир завершён!' + (v.me.prize ? '<br><b>Твой приз: +' + v.me.prize + '</b> ' + IC_GEM + ' 🎉' : (meP ? '<br>Призы достались топ-3 — в следующий раз!' : ''));
    play.classList.add('hidden');
    if (v.me.prize) gemRain(24);
  } else if (v.me.joined && v.me.played){
    big.textContent = v.me.score; big.classList.remove('hidden');
    info.innerHTML = 'Твой счёт принят! Сыграли ' + v.finishers + ' из ' + v.joined + '.<br>Итоги: когда сыграют все или через ' + hh + ' ч ' + mm + ' м.<br>Призы: ' + prizesTxt;
    play.classList.add('hidden');
  } else if (v.me.joined){
    info.innerHTML = 'Ты в турнире! Оста' + (v.me.tries > 1 ? 'лась последняя попытка' : 'лось сыграть раунд') + ' — ' + DUEL_DROPS_C + ' бросков.<br>Итоги через ' + hh + ' ч ' + mm + ' м. Призы: ' + prizesTxt;
    play.classList.remove('hidden');
    play.innerHTML = '<svg class="ic"><use href="#i-play"/></svg>Играть раунд';
  } else if (v.joined >= v.maxPlayers){
    info.textContent = 'Все ' + v.maxPlayers + ' мест заняты. Создай свой турнир!'; play.classList.add('hidden');
  } else {
    info.innerHTML = 'Ставка: <b>' + v.stake + '</b> ' + IC_GEM + ' · мест: ' + v.joined + '/' + v.maxPlayers + ' · одна колода на всех.<br>Топ-3 делят банк: ' + prizesTxt + '<br>До итогов: ' + hh + ' ч ' + mm + ' м.';
    play.classList.remove('hidden');
    play.innerHTML = '<svg class="ic"><use href="#i-arena"/></svg>Вступить (−' + v.stake + ' <svg class="ic"><use href="#i-gem"/></svg>)';
  }
  list.innerHTML = '';
  if (v.players && v.players.length){
    var sorted = v.players;
    for (var i = 0; i < sorted.length; i++){
      var r = sorted[i];
      var div = document.createElement('div');
      div.className = 'toprow' + (r.user_id === v.myId ? ' me' : '');
      var rk = document.createElement('span');
      rk.className = 'rk' + (v.status === 'done' && i === 0 && r.played ? ' gold' : '');
      rk.textContent = r.played ? (i + 1) : '…';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name || 'Игрок';
      var gm = document.createElement('span'); gm.className = 'gm';
      if (v.status === 'done' && r.prize) gm.innerHTML = r.score + ' (+' + r.prize + ' ' + IC_GEM + ')';
      else gm.textContent = r.played ? r.score : 'играет';
      div.appendChild(rk); div.appendChild(nm); div.appendChild(gm);
      list.appendChild(div);
    }
  } else {
    list.innerHTML = '<div class="best">Пока никого — стань первым участником!</div>';
  }
}
function openTour(){
  if (!tourParam) return;
  showTourScreen(); tourState = null; renderTour();
  wapi('/tour/state', { tour: tourParam.raw }, function(d){
    tourState = (d && d.ok) ? d.view : null;
    if (!tourState){ $('tourInfo').textContent = 'Не удалось загрузить турнир.'; return; }
    renderTour();
  });
}
function tourFinish(){
  showTourScreen();
  $('tourBig').textContent = score; $('tourBig').classList.remove('hidden');
  $('tourList').innerHTML = ''; $('btnTourPlay').classList.add('hidden');
  $('tourInfo').innerHTML = '<span class="spinner"></span> Отправляю результат…';
  wapi('/tour/score', { tour: tourParam.raw, score: score, dur: Date.now() - gameStartTs, moves: dropsCount }, function(d){
    refreshMe();
    if (!d || !d.ok){ $('tourInfo').textContent = 'Не удалось отправить. Открой турнир по кнопке в чате ещё раз.'; return; }
    tourState = d.view; renderTour();
  });
}
$('btnTourMenu').addEventListener('click', function(){ sfxClick(); hide('scrTour'); openMenu(); });
$('btnTourPlay').addEventListener('click', function(){
  audio(); sfxClick();
  var play = $('btnTourPlay');
  play.disabled = true; play.innerHTML = '<span class="spinner"></span> Вхожу…';
  wapi('/tour/join', { tour: tourParam.raw }, function(d){
    if (d && d.ok){
      duelActive = true; duelKind = 'tour';
      duelSeedVal = d.seed; duelIdx = 0; duelViewCache = null;
      hide('scrTour'); startGame();
      return;
    }
    if (d && d.error === 'balance'){ tourState && (tourState.me = { joined:false }); $('tourInfo').innerHTML = 'Не хватает кристаллов: нужно <b>' + (d.need || 50) + '</b> ' + IC_GEM + '. Забери бонус дня или сыграй обычные партии!'; play.classList.add('hidden'); return; }
    openTour(); // full/attempts/closed/played — перерисуем состояние
  });
});

// ---------- Топ сезона ----------
var topData = null, topTab = 'r', duelHist = null;
function renderHistory(){
  var list = $('topList');
  list.innerHTML = '';
  $('topMe').textContent = '';
  if (!duelHist){ list.innerHTML = '<div class="best"><span class="spinner"></span> Загружаю…</div>'; return; }
  if (!duelHist.length){ list.innerHTML = '<div class="best">Дуэлей пока не было — вызови кого-нибудь!</div>'; return; }
  for (var i = 0; i < duelHist.length; i++){
    var h = duelHist[i];
    var div = document.createElement('div'); div.className = 'toprow';
    var rk = document.createElement('span'); rk.className = 'rk';
    if (h.result === 'win'){ rk.className = 'rk gold'; rk.innerHTML = '<svg class="ic"><use href="#i-trophy"/></svg>'; }
    else if (h.result === 'lose'){ rk.textContent = '✕'; rk.style.color = '#ff8a80'; }
    else if (h.result === 'draw'){ rk.textContent = '='; }
    else if (h.result === 'expired'){ rk.textContent = '—'; }
    else { rk.textContent = '…'; }
    var nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = h.oppName ? 'против ' + h.oppName : (h.result === 'wait' ? 'ждём соперника' : 'без соперника');
    var wn = document.createElement('span'); wn.className = 'wn';
    wn.textContent = (h.myScore != null ? h.myScore : '—') + ':' + (h.oppScore != null ? h.oppScore : '—');
    var gm = document.createElement('span');
    gm.className = 'gm' + (h.delta < 0 ? ' neg' : h.delta === 0 ? ' zero' : '');
    gm.innerHTML = (h.delta > 0 ? '+' : '') + h.delta + ' ' + IC_GEM;
    div.appendChild(rk); div.appendChild(nm); div.appendChild(wn); div.appendChild(gm);
    list.appendChild(div);
  }
}
function renderTop(){
  $('topTabR').classList.toggle('on', topTab === 'r');
  $('topTabG').classList.toggle('on', topTab === 'g');
  $('topTabH').classList.toggle('on', topTab === 'h');
  if (topTab === 'h'){ renderHistory(); return; }
  var list = $('topList');
  list.innerHTML = '';
  if (!topData){ list.innerHTML = '<div class="best"><span class="spinner"></span> Загружаю…</div>'; return; }
  var rows = topTab === 'g' ? topData.global : topData.rivals;
  if (!rows || !rows.length){
    list.innerHTML = '<div class="best">Пока пусто — выиграй дуэль и открой сезон!</div>';
  } else {
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      var div = document.createElement('div');
      div.className = 'toprow' + (r.user_id === topData.myId ? ' me' : '');
      var rk = document.createElement('span');
      rk.className = 'rk' + (i===0?' gold':i===1?' silv':i===2?' brnz':'');
      rk.textContent = i + 1;
      var nm = document.createElement('span'); nm.className = 'nm';
      nm.textContent = r.name || 'Игрок';
      if (topData.prevTop3 && topData.prevTop3.indexOf(r.user_id) >= 0){
        nm.insertAdjacentHTML('afterbegin', '<svg class="ic"><use href="#i-crown"/></svg> ');
      }
      var wn = document.createElement('span'); wn.className = 'wn';
      wn.textContent = r.wins + ' поб.';
      var gm = document.createElement('span'); gm.className = 'gm';
      gm.innerHTML = r.gems + ' ' + IC_GEM;
      div.appendChild(rk); div.appendChild(nm); div.appendChild(wn); div.appendChild(gm);
      list.appendChild(div);
    }
  }
  var me = $('topMe');
  if (topData.my && topData.my.rank) me.innerHTML = 'Твоё место в мире: <b>#' + topData.my.rank + '</b> · ' + topData.my.gems + ' ' + IC_GEM + ' · побед: ' + topData.my.wins;
  else me.textContent = 'Выиграй дуэль, чтобы попасть в топ!';
  var left = topData.endsAt - Date.now();
  if (left > 0){
    var dd = Math.floor(left / 86400000), hh = Math.floor(left % 86400000 / 3600000);
    $('topSeason').textContent = 'До конца сезона: ' + (dd > 0 ? dd + ' д ' : '') + hh + ' ч';
  } else $('topSeason').textContent = '';
}
function openTop(){
  hide('scrMenu'); show('scrTop'); state = 'menu';
  topData = null; duelHist = null; renderTop();
  wapi('/top', null, function(d){
    if (d && d.ok) topData = d;
    else topData = { global: [], rivals: [], my: null, myId: 0, endsAt: 0 };
    renderTop();
  });
}
$('btnTop').addEventListener('click', function(){ sfxClick(); openTop(); });
$('btnTopClose').addEventListener('click', function(){ sfxClick(); hide('scrTop'); show('scrMenu'); });
