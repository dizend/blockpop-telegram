<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БлокПоп!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { width:100%; height:100%; overflow:hidden; background:#231a3f; }
  body { font-family:'Arial Rounded MT Bold','Helvetica Rounded',Arial,system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,#2e2154 0%,#231a3f 55%,#1b1430 100%); }
  #hud { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; padding:10px 12px 4px; gap:8px; z-index:5; }
  .pill { background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.14); border-radius:16px; padding:5px 12px; text-align:center; min-width:86px; }
  .pill .lbl { font-size:10px; letter-spacing:1px; color:#b7a8e8; text-transform:uppercase; }
  .pill .val { font-size:19px; font-weight:bold; color:#fff; line-height:1.1; }
  #btnPause { width:44px; height:44px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  #cv { display:block; touch-action:none; z-index:1; }
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(24,16,45,.90); backdrop-filter:blur(6px); padding:24px; text-align:center; }
  .hidden { display:none !important; }
  .logo { font-size:min(13vw,58px); font-weight:bold; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.35); letter-spacing:1px; }
  .logo .c1{color:#ff6b6b}.logo .c2{color:#ffb84d}.logo .c3{color:#ffe14d}.logo .c4{color:#6bd96b}.logo .c5{color:#5ec8ff}.logo .c6{color:#c39bff}
  .sub { color:#b7a8e8; font-size:15px; max-width:320px; line-height:1.45; }
  .btn { appearance:none; border:none; cursor:pointer; border-radius:20px; padding:14px 34px; font-size:20px; font-weight:bold; color:#fff; font-family:inherit;
         background:linear-gradient(180deg,#ff9d4d,#ff6b3d); box-shadow:0 5px 0 #c74a24, 0 8px 16px rgba(0,0,0,.35); transition:transform .06s; min-width:220px; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #c74a24; }
  .btn.blue { background:linear-gradient(180deg,#5ec8ff,#3d8bff); box-shadow:0 5px 0 #2456b8, 0 8px 16px rgba(0,0,0,.35); }
  .btn.blue:active { box-shadow:0 2px 0 #2456b8; }
  .btn.green { background:linear-gradient(180deg,#7ee06b,#3fbf4d); box-shadow:0 5px 0 #23803a, 0 8px 16px rgba(0,0,0,.35); }
  .btn.green:active { box-shadow:0 2px 0 #23803a; }
  .btn.ghost { background:rgba(255,255,255,.10); box-shadow:none; border:2px solid rgba(255,255,255,.22); font-size:16px; padding:10px 22px; min-width:0; }
  .toggles { display:flex; gap:12px; }
  .tgl { width:56px; height:56px; border-radius:18px; border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); font-size:24px; cursor:pointer; color:#fff; }
  .tgl.off { opacity:.38; filter:grayscale(1); }
  .bigscore { font-size:52px; font-weight:bold; color:#ffe14d; text-shadow:0 3px 0 rgba(0,0,0,.4); line-height:1; }
  .overttl { font-size:min(11vw,44px); font-weight:bold; color:#ff6b6b; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  .best { color:#b7a8e8; font-size:16px; }
  .newrec { color:#ffe14d; font-size:18px; font-weight:bold; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  #userHello { color:#8f7fc9; font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="pill"><div class="lbl">Счёт</div><div class="val" id="hudScore">0</div></div>
    <div class="pill"><div class="lbl">Рекорд</div><div class="val" id="hudBest">0</div></div>
    <button id="btnPause" aria-label="Пауза">⏸</button>
  </div>
  <canvas id="cv"></canvas>
</div>

<div id="scrMenu" class="screen">
  <div class="logo"><span class="c1">Б</span><span class="c2">л</span><span class="c3">о</span><span class="c4">к</span><span class="c5">П</span><span class="c6">о</span><span class="c1">п</span><span class="c3">!</span></div>
  <div class="sub">Бросай блоки в колонки. Одинаковые соседи сливаются и удваиваются. Собери <b style="color:#ffe14d">2048</b>!</div>
  <div class="best" id="menuBest">Рекорд: 0</div>
  <button class="btn green" id="btnPlay">▶ Играть</button>
  <div class="toggles">
    <button class="tgl" id="tglSound" title="Звук">🔊</button>
    <button class="tgl" id="tglMusic" title="Музыка">🎵</button>
  </div>
  <div id="userHello"></div>
</div>

<div id="scrPause" class="screen hidden">
  <div class="logo" style="font-size:38px">Пауза</div>
  <button class="btn green" id="btnResume">▶ Продолжить</button>
  <button class="btn blue" id="btnRestart1">↺ Заново</button>
  <button class="btn ghost" id="btnMenu1">В меню</button>
  <div class="toggles">
    <button class="tgl" id="tglSound2" title="Звук">🔊</button>
    <button class="tgl" id="tglMusic2" title="Музыка">🎵</button>
  </div>
</div>

<div id="scrOver" class="screen hidden">
  <div class="overttl">Игра окончена!</div>
  <div class="bigscore" id="overScore">0</div>
  <div class="best" id="overBest">Рекорд: 0</div>
  <div class="newrec hidden" id="newRec">🏆 Новый рекорд!</div>
  <div class="best hidden" id="scoreSent"></div>
  <button class="btn green" id="btnAgain">↺ Ещё раз</button>
  <button class="btn blue" id="btnShare">📤 Поделиться</button>
  <button class="btn ghost" id="btnMenu2">В меню</button>
</div>

<script>
'use strict';
/* ============================================================
   БлокПоп! — Telegram Mini App edition
   Один самодостаточный файл. Canvas + WebAudio.
   ============================================================ */

// ---------- Telegram Mini App integration ----------
var TG_BOT_URL = 'https://t.me/BlockPopGameBot/play'; // ссылка мини-аппа (кнопка «Поделиться»)
var SCORE_API = 'https://blockpop-bot.dizend.workers.dev/score'; // воркер лидерборда

// Контекст «игры из чата» (Games API): подписанные параметры из URL
var GAME_CTX = null;
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('sig') && q.get('u') && q.get('ts')) {
      GAME_CTX = { u:q.get('u'), im:q.get('im')||'', c:q.get('c')||'', m:q.get('m')||'', ts:q.get('ts'), sig:q.get('sig') };
    }
  } catch(e){}
})();
function submitScore(s){
  if (!GAME_CTX || !SCORE_API) return;
  var el = document.getElementById('scoreSent');
  if (el){ el.textContent = 'Отправляю результат…'; el.classList.remove('hidden'); }
  try {
    fetch(SCORE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // без preflight
      body: JSON.stringify({ score:s, u:GAME_CTX.u, im:GAME_CTX.im, c:GAME_CTX.c, m:GAME_CTX.m, ts:GAME_CTX.ts, sig:GAME_CTX.sig })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!el) return;
      if (d && d.ok && d.recorded) el.textContent = '🏆 Результат записан в рейтинг чата!';
      else if (d && d.ok) el.textContent = 'Рекорд в рейтинге чата не побит — жми «Ещё раз»!';
      else el.classList.add('hidden');
    }).catch(function(){ if (el) el.classList.add('hidden'); });
  } catch(e){ if (el) el.classList.add('hidden'); }
}
var tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined) ? window.Telegram.WebApp : null;
var tgReady = false;
if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#2e2154');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#231a3f');
    tgReady = true;
  } catch(e) {}
}
function tgVer(v){ try { return tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v); } catch(e){ return false; } }

// ---------- Storage: Telegram CloudStorage → localStorage → память ----------
var memStore = {};
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return memStore[k]!==undefined?memStore[k]:null; } }
function lsSet(k,v){ try { localStorage.setItem(k,String(v)); } catch(e){} memStore[k]=String(v); }
function storeGet(k, cb){
  var local = lsGet(k);
  if (tg && tg.CloudStorage && tgVer('6.9')) {
    try {
      tg.CloudStorage.getItem(k, function(err, val){
        if (!err && val !== null && val !== undefined && val !== '') cb(val);
        else cb(local);
      });
      return;
    } catch(e){}
  }
  cb(local);
}
function storeSet(k, v){
  lsSet(k, v);
  if (tg && tg.CloudStorage && tgVer('6.9')) { try { tg.CloudStorage.setItem(k, String(v), function(){}); } catch(e){} }
}

// ---------- Вибрация ----------
function haptic(kind){
  if (tg && tg.HapticFeedback && tgVer('6.1')) {
    try {
      if (kind==='drop') tg.HapticFeedback.impactOccurred('light');
      else if (kind==='merge') tg.HapticFeedback.impactOccurred('medium');
      else if (kind==='boom') tg.HapticFeedback.impactOccurred('heavy');
      else if (kind==='over') tg.HapticFeedback.notificationOccurred('error');
      else if (kind==='rec') tg.HapticFeedback.notificationOccurred('success');
      return;
    } catch(e){}
  }
  if (navigator.vibrate) {
    try {
      if (kind==='drop') navigator.vibrate(10);
      else if (kind==='merge') navigator.vibrate(20);
      else if (kind==='boom') navigator.vibrate([30,40,30]);
      else if (kind==='over') navigator.vibrate([60,60,60]);
      else if (kind==='rec') navigator.vibrate([20,30,20,30,60]);
    } catch(e){}
  }
}

// ---------- Звук и музыка (WebAudio) ----------
var AC = window.AudioContext || window.webkitAudioContext;
var actx = null, sndOn = true, musOn = true, musTimer = null, musStep = 0;
function audio(){ if (!actx && AC) { try { actx = new AC(); } catch(e){} } if (actx && actx.state==='suspended') { try{actx.resume();}catch(e){} } return actx; }
function tone(freq, dur, type, vol, when, slide){
  var a = audio(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||'square'; var t = a.currentTime + (when||0);
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}
function sfxDrop(){ if(sndOn) tone(300,0.09,'square',0.12,0,180); }
function sfxLand(){ if(sndOn) tone(150,0.08,'triangle',0.18,0,90); }
function sfxMerge(v, chain){
  if(!sndOn) return;
  var base = 260 + Math.min(9,Math.log2(v))*60 + chain*40;
  tone(base,0.10,'square',0.14); tone(base*1.5,0.12,'square',0.10,0.05); tone(base*2,0.14,'triangle',0.10,0.10);
}
function sfxCombo(n){ if(!sndOn) return; for(var i=0;i<Math.min(n,5);i++) tone(400+i*140,0.09,'square',0.10,i*0.055); }
function sfxBoom(){ if(!sndOn) return; tone(120,0.5,'sawtooth',0.22,0,40); tone(80,0.6,'square',0.18,0.05,30); tone(700,0.25,'triangle',0.10,0,120); }
function sfxOver(){ if(!sndOn) return; tone(392,0.18,'triangle',0.16); tone(330,0.18,'triangle',0.16,0.18); tone(262,0.18,'triangle',0.16,0.36); tone(196,0.5,'triangle',0.18,0.54,98); }
function sfxClick(){ if(sndOn) tone(600,0.06,'square',0.08,0,500); }
var MELODY = [523,0,659,0,784,659,523,0, 587,0,698,0,880,698,587,0, 523,0,659,0,784,659,1047,0, 880,784,698,659,587,0,523,0];
var BASSLN = [131,0,165,0,131,0,165,0, 147,0,175,0,147,0,175,0, 131,0,165,0,131,0,165,0, 147,0,196,0,131,0,131,0];
function musicTick(){
  if (!musOn || !actx) return;
  var m = MELODY[musStep % MELODY.length], b = BASSLN[musStep % BASSLN.length];
  if (m) tone(m, 0.16, 'triangle', 0.045);
  if (b) tone(b, 0.30, 'sine', 0.06);
  musStep++;
}
function musicStart(){ if (musTimer) return; if (!audio()) return; musTimer = setInterval(musicTick, 170); }
function musicStop(){ if (musTimer) { clearInterval(musTimer); musTimer = null; } }
function syncMusic(){ if (musOn && (state==='aim'||state==='drop'||state==='resolve')) musicStart(); else musicStop(); }

// ---------- Игровые константы ----------
var COLS = 5, ROWS = 7;
var COLORS = {
  2:    ['#ff8a80','#ff5252','#c62828'],
  4:    ['#ffb74d','#ff9100','#c25e00'],
  8:    ['#fff176','#ffd600','#b39b00'],
  16:   ['#aed581','#7cb342','#4b830d'],
  32:   ['#4dd0e1','#00acc1','#007c91'],
  64:   ['#64b5f6','#1e88e5','#1257a8'],
  128:  ['#b39ddb','#7e57c2','#4d2c91'],
  256:  ['#f48fb1','#ec407a','#b4004e'],
  512:  ['#ffd54f','#ffb300','#c68400'],
  1024: ['#80cbc4','#26a69a','#00766c'],
  2048: ['#ffab91','#ff7043','#c63f17'],
  4096: ['#ea80fc','#d500f9','#9e00c5']
};
function colorFor(v){ return COLORS[v] || COLORS[4096]; }

// ---------- Состояние ----------
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W=0, H=0, DPR=1, cell=0, boardX=0, boardY=0, boardW=0, boardH=0, topZone=0;
var state = 'menu';  // menu | aim | drop | resolve | pause | over
var grid = [];       // grid[c][r] -> block | null ; r=0 низ
var blocks = [];     // все блоки на поле
var uid = 1;
var curBlock = null; // {v, col, x} — прицеливание
var nextV = 2;
var dropB = null;    // падающий блок
var score = 0, best = 0, combo = 0, moveTick = 0;
var milestones = {};
var particles = [], floaters = [], shakeT = 0, bannerT = 0, bannerTxt = '';
var pausedFrom = 'aim';

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

// ---------- Размеры ----------
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  var vw = Math.min(window.innerWidth, 520);
  var vh = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : window.innerHeight;
  var hudH = $('hud') ? document.getElementById('hud').offsetHeight : 60;
  var availH = vh - hudH - 8;
  W = vw; H = Math.max(300, availH);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var padX = 10;
  cell = Math.min((W-padX*2)/COLS, (H-20) / (ROWS+2.1));
  boardW = cell*COLS; boardH = cell*ROWS;
  boardX = (W-boardW)/2;
  topZone = cell*1.7;
  boardY = Math.min(topZone + 8, H - boardH - 12);
  if (boardY < topZone) boardY = topZone;
  // пересчитать координаты блоков под новую геометрию (иначе после поворота/смены вьюпорта блоки "зависают")
  for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    b.targetY = cellY(b.row);
    if (b !== dropB) { b.y = b.targetY; b.vy = 0; }
  }
  if (curBlock) curBlock.x = cellX(curBlock.col)+cell/2;
}
window.addEventListener('resize', resize);
if (tg && tg.onEvent) { try { tg.onEvent('viewportChanged', resize); } catch(e){} }

// ---------- Помощники поля ----------
function newGrid(){ grid=[]; for(var c=0;c<COLS;c++){ grid[c]=[]; for(var r=0;r<ROWS;r++) grid[c][r]=null; } }
function colHeight(c){ var h=0; for(var r=0;r<ROWS;r++) if(grid[c][r]) h++; return h; }
function boardFull(){ for(var c=0;c<COLS;c++) if(colHeight(c)<ROWS) return false; return true; }
function cellX(c){ return boardX + c*cell; }
function cellY(r){ return boardY + (ROWS-1-r)*cell; } // r=0 внизу
function maxVal(){ var m=0; blocks.forEach(function(b){ if(b.v>m) m=b.v; }); return m; }
function spawnPool(){
  var m = Math.max(maxVal(), 4);
  var pool = [2,2,2,4,4,8];
  if (m>=32) pool.push(8,16);
  if (m>=128) pool.push(16,32);
  if (m>=512) pool.push(32,64);
  return pool;
}
function rndNext(){ var p = spawnPool(); return p[Math.floor(Math.random()*p.length)]; }

// ---------- Запуск игры ----------
function startGame(){
  newGrid(); blocks=[]; particles=[]; floaters=[]; dropB=null;
  score=0; combo=0; milestones={}; shakeT=0; bannerT=0;
  var ss=$('scoreSent'); if (ss){ ss.classList.add('hidden'); ss.textContent=''; }
  nextV = rndNext();
  spawnCur();
  updateHud();
  state='aim';
  syncMusic();
}
function spawnCur(){
  curBlock = { v: nextV, col: 2, x: cellX(2)+cell/2 };
  nextV = rndNext();
}

// ---------- Бросок ----------
function tryDrop(col){
  if (state!=='aim' || !curBlock) return;
  if (colHeight(col) >= ROWS) { shakeT = 8; sfxClick(); return; }
  var b = { id:uid++, v:curBlock.v, col:col, row:colHeight(col), y: topZone - cell, scale:1, pop:0, tick:++moveTick };
  b.targetY = cellY(b.row);
  grid[col][b.row] = b;
  blocks.push(b);
  dropB = b;
  curBlock = null;
  state = 'drop';
  sfxDrop(); haptic('drop');
}

// ---------- Слияния ----------
function findMergeGroup(){
  // ищем лучшую группу: связная область одинаковых значений (4-направления), size>=2
  var seen = {};
  var bestG = null;
  for (var c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
    var b = grid[c][r]; if (!b) continue;
    var key = c+','+r; if (seen[key]) continue;
    // BFS
    var q=[[c,r]], g=[], v=b.v; seen[key]=1;
    while(q.length){
      var cur=q.pop(), cc=cur[0], rr=cur[1];
      var bb=grid[cc][rr]; if(!bb||bb.v!==v) continue;
      g.push(bb);
      var nb=[[cc-1,rr],[cc+1,rr],[cc,rr-1],[cc,rr+1]];
      for(var i=0;i<nb.length;i++){
        var nc=nb[i][0], nr=nb[i][1];
        if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
        var k2=nc+','+nr; if(seen[k2]) continue;
        var b2=grid[nc][nr];
        if(b2 && b2.v===v){ seen[k2]=1; q.push([nc,nr]); }
      }
    }
    if (g.length>=2){
      if (!bestG || g.length>bestG.length) bestG = g;
    }
  }
  return bestG;
}
function doMerge(group){
  // цель — последний двигавшийся блок группы
  var target = group[0];
  for (var i=1;i<group.length;i++) if (group[i].tick > target.tick) target = group[i];
  var newV = target.v * Math.pow(2, group.length-1);
  combo++;
  var gained = newV * combo;
  score += gained;
  // убрать остальных
  for (var j=0;j<group.length;j++){
    var b = group[j];
    if (b===target) continue;
    grid[b.col][b.row] = null;
    blocks.splice(blocks.indexOf(b),1);
    burst(cellX(b.col)+cell/2, b.y+cell/2, colorFor(b.v)[1], 10);
  }
  target.v = newV; target.pop = 1; target.tick = ++moveTick;
  floaters.push({x:cellX(target.col)+cell/2, y:target.y, txt:'+'+gained, t:0, col:'#ffe14d'});
  if (combo>1) floaters.push({x:W/2, y:boardY-10, txt:'КОМБО x'+combo+'!', t:0, col:'#5ec8ff', big:1});
  sfxMerge(newV, combo); if (combo>1) sfxCombo(combo);
  haptic('merge');
  checkMilestone(newV);
  applyGravity();
  updateHud();
}
function checkMilestone(v){
  if ((v===512||v===1024||v===2048||v===4096) && !milestones[v]){
    milestones[v]=1;
    var thr = v===512?2 : v===1024?4 : v===2048?8 : 16;
    var boomed=0;
    for (var c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
      var b=grid[c][r];
      if (b && b.v<=thr){
        grid[c][r]=null; blocks.splice(blocks.indexOf(b),1);
        burst(cellX(c)+cell/2, b.y+cell/2, colorFor(b.v)[0], 14);
        boomed++;
      }
    }
    if (boomed>0){ score += boomed*thr*2; }
    bannerTxt = '💥 БУМ! ' + v + '!'; bannerT = 90; shakeT = 14;
    sfxBoom(); haptic('boom');
    applyGravity();
  }
}
function applyGravity(){
  for (var c=0;c<COLS;c++){
    var stack=[];
    for (var r=0;r<ROWS;r++) if (grid[c][r]) stack.push(grid[c][r]);
    for (r=0;r<ROWS;r++) grid[c][r]=null;
    for (var i=0;i<stack.length;i++){
      var b=stack[i];
      if (b.row!==i) b.tick = ++moveTick;
      b.row=i; grid[c][i]=b;
      b.targetY = cellY(i);
    }
  }
}
function allSettled(){
  for (var i=0;i<blocks.length;i++){ if (Math.abs(blocks[i].y - blocks[i].targetY) > 0.5) return false; }
  return true;
}

// ---------- Game over ----------
var pendingRecord = false;
function gameOver(){
  state='over'; musicStop();
  sfxOver(); haptic('over');
  var isRec = score > best;
  if (isRec){ best = score; storeSet('bp_best', best); haptic('rec'); }
  $('overScore').textContent = score;
  $('overBest').textContent = 'Рекорд: ' + best;
  if (isRec) show('newRec'); else hide('newRec');
  submitScore(score);
  updateHud();
  setTimeout(function(){ show('scrOver'); }, 600);
}

// ---------- Частицы и эффекты ----------
function burst(x,y,color,n){
  for (var i=0;i<n;i++){
    var a=Math.random()*6.283, s=1.5+Math.random()*3.5;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,t:0,life:30+Math.random()*20,color:color,r:2+Math.random()*3});
  }
}

// ---------- Отрисовка ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBlock(x,y,v,scale,popped){
  var pad = cell*0.055, s = cell - pad*2;
  var cx = x+cell/2, cy = y+cell/2;
  var sc = scale || 1;
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.translate(-cx,-cy);
  var cols = colorFor(v);
  // тень
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  rr(x+pad, y+pad+s*0.06, s, s, s*0.24); ctx.fill();
  // корпус
  var g = ctx.createLinearGradient(0,y,0,y+cell);
  g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  ctx.fillStyle = g;
  rr(x+pad, y+pad, s, s, s*0.24); ctx.fill();
  ctx.strokeStyle = cols[2]; ctx.lineWidth = Math.max(1.5, cell*0.035);
  rr(x+pad, y+pad, s, s, s*0.24); ctx.stroke();
  // блик
  ctx.fillStyle = 'rgba(255,255,255,.30)';
  rr(x+pad+s*0.10, y+pad+s*0.08, s*0.8, s*0.28, s*0.14); ctx.fill();
  // глазки
  var ey = y+pad+s*0.42, ex1 = x+pad+s*0.30, ex2 = x+pad+s*0.70, er = Math.max(1.6, s*0.055);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex1,ey,er*1.8,0,6.283); ctx.arc(ex2,ey,er*1.8,0,6.283); ctx.fill();
  ctx.fillStyle = '#332';
  ctx.beginPath(); ctx.arc(ex1,ey+er*0.35,er,0,6.283); ctx.arc(ex2,ey+er*0.35,er,0,6.283); ctx.fill();
  // улыбка
  ctx.strokeStyle = 'rgba(40,20,20,.75)'; ctx.lineWidth = Math.max(1.4, s*0.04); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx, ey+er*1.2, s*0.16, 0.35, 2.79); ctx.stroke();
  // число
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(2, s*0.07);
  var fs = v>=1024 ? s*0.30 : v>=128 ? s*0.36 : s*0.42;
  ctx.font = 'bold ' + fs + 'px "Arial Rounded MT Bold", Arial, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin = 'round';
  ctx.strokeText(String(v), cx, y+pad+s*0.80);
  ctx.fillText(String(v), cx, y+pad+s*0.80);
  ctx.restore();
}
var aimColGlow = 2;
function draw(){
  ctx.clearRect(0,0,W,H);
  var shx = 0, shy = 0;
  if (shakeT>0){ shakeT--; shx=(Math.random()-0.5)*shakeT*0.9; shy=(Math.random()-0.5)*shakeT*0.9; }
  ctx.save(); ctx.translate(shx,shy);

  // рамка поля
  ctx.fillStyle = 'rgba(255,255,255,.055)';
  rr(boardX-6, boardY-6, boardW+12, boardH+12, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth=2;
  rr(boardX-6, boardY-6, boardW+12, boardH+12, 18); ctx.stroke();

  // колонки
  for (var c=0;c<COLS;c++){
    if ((state==='aim') && curBlock && c===curBlock.col){
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      rr(cellX(c)+2, boardY-2, cell-4, boardH+4, 10); ctx.fill();
    }
  }
  // разметка: ячейки-слоты
  for (c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
    var inset = Math.max(2.5, cell*0.045);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    rr(boardX+c*cell+inset, boardY+r*cell+inset, cell-inset*2, cell-inset*2, cell*0.18);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.09)';
    ctx.lineWidth = 1.5;
    rr(boardX+c*cell+inset, boardY+r*cell+inset, cell-inset*2, cell-inset*2, cell*0.18);
    ctx.stroke();
  }

  // блоки
  for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    var sc = 1;
    if (b.pop>0){ sc = 1 + Math.sin(b.pop*3.1416)*0.22; b.pop -= 0.08; if (b.pop<0) b.pop=0; }
    drawBlock(cellX(b.col), b.y, b.v, sc);
  }

  // прицельный блок + следующий
  if (state==='aim' && curBlock){
    var tx = cellX(curBlock.col)+cell/2;
    curBlock.x += (tx-curBlock.x)*0.35;
    drawBlock(curBlock.x-cell/2, topZone-cell-4, curBlock.v, 1);
    // пунктир траектории
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2; ctx.setLineDash([4,7]);
    var landR = colHeight(curBlock.col);
    var endY = landR>=ROWS ? boardY : cellY(landR);
    ctx.beginPath(); ctx.moveTo(tx, topZone-2); ctx.lineTo(tx, endY); ctx.stroke();
    ctx.setLineDash([]);
    // следующий
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.font='11px Arial'; ctx.textAlign='center';
    ctx.fillText('след.', boardX+boardW-cell*0.4, topZone-cell-10);
    drawBlock(boardX+boardW-cell*0.78, topZone-cell*0.95, nextV, 0.52);
  }

  // частицы
  for (i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.t++; p.x+=p.vx; p.y+=p.vy; p.vy+=0.14;
    if (p.t>p.life){ particles.splice(i,1); continue; }
    ctx.globalAlpha = 1-(p.t/p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // всплывающий текст
  for (i=floaters.length-1;i>=0;i--){
    var f = floaters[i];
    f.t++; if (f.t>55){ floaters.splice(i,1); continue; }
    ctx.globalAlpha = f.t<45 ? 1 : (55-f.t)/10;
    ctx.fillStyle = f.col;
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.font = 'bold ' + (f.big? 24:17) + 'px "Arial Rounded MT Bold", Arial, sans-serif';
    ctx.textAlign='center';
    var yy = f.y - f.t*0.7;
    ctx.strokeText(f.txt, f.x, yy); ctx.fillText(f.txt, f.x, yy);
    ctx.globalAlpha=1;
  }
  // баннер
  if (bannerT>0){
    bannerT--;
    ctx.globalAlpha = Math.min(1, bannerT/20);
    ctx.fillStyle='#ffe14d'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=5; ctx.lineJoin='round';
    ctx.font='bold 34px "Arial Rounded MT Bold", Arial, sans-serif'; ctx.textAlign='center';
    ctx.strokeText(bannerTxt, W/2, boardY+boardH*0.4);
    ctx.fillText(bannerTxt, W/2, boardY+boardH*0.4);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ---------- Игровой цикл ----------
var resolveWait = 0;
function step(){
  // физика падения (замирает на паузе)
  if (state!=='pause') for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    if (b.y < b.targetY){
      b.vy = (b.vy||0) + 1.6;
      b.y += b.vy;
      if (b.y >= b.targetY){ b.y = b.targetY; b.vy = 0; }
    } else if (b.y > b.targetY){
      b.y = b.targetY; b.vy = 0;
    }
  }
  if (state==='drop'){
    if (dropB && Math.abs(dropB.y-dropB.targetY)<0.5){
      sfxLand();
      dropB = null;
      state = 'resolve';
      resolveWait = 4;
    }
  } else if (state==='resolve'){
    if (allSettled()){
      if (resolveWait>0){ resolveWait--; }
      else {
        var g = findMergeGroup();
        if (g){ doMerge(g); resolveWait = 7; }
        else {
          combo = 0;
          if (boardFull()){ gameOver(); }
          else { spawnCur(); state='aim'; }
        }
      }
    }
  }
  draw();
  requestAnimationFrame(step);
}

// ---------- HUD и экраны ----------
function updateHud(){
  $('hudScore').textContent = score;
  $('hudBest').textContent = best;
}
function openMenu(){
  state='menu'; musicStop();
  $('menuBest').textContent = 'Рекорд: ' + best;
  show('scrMenu'); hide('scrPause'); hide('scrOver');
}
function doPause(){
  if (state!=='aim' && state!=='drop' && state!=='resolve') return;
  pausedFrom = state; state='pause'; musicStop();
  show('scrPause');
}
function doResume(){
  hide('scrPause'); state = pausedFrom; syncMusic();
}
function syncToggles(){
  [['tglSound',sndOn],['tglSound2',sndOn],['tglMusic',musOn],['tglMusic2',musOn]].forEach(function(p){
    var el=$(p[0]); if(el) el.classList.toggle('off', !p[1]);
  });
}

// ---------- Ввод ----------
function colFromX(px){
  var c = Math.floor((px - boardX)/cell);
  return Math.max(0, Math.min(COLS-1, c));
}
var pressCol = -1;
cv.addEventListener('pointerdown', function(e){
  audio();
  if (state!=='aim' || !curBlock) return;
  pressCol = colFromX(e.clientX - cv.getBoundingClientRect().left);
  curBlock.col = pressCol;
});
cv.addEventListener('pointermove', function(e){
  if (state!=='aim' || !curBlock || pressCol<0) return;
  curBlock.col = colFromX(e.clientX - cv.getBoundingClientRect().left);
});
window.addEventListener('pointerup', function(e){
  if (state==='aim' && curBlock && pressCol>=0){
    var c = colFromX(e.clientX - cv.getBoundingClientRect().left);
    tryDrop(c);
  }
  pressCol = -1;
});
window.addEventListener('keydown', function(e){
  if (state==='aim' && curBlock){
    if (e.key==='ArrowLeft'){ curBlock.col = Math.max(0,curBlock.col-1); e.preventDefault(); }
    else if (e.key==='ArrowRight'){ curBlock.col = Math.min(COLS-1,curBlock.col+1); e.preventDefault(); }
    else if (e.key==='ArrowDown' || e.key===' '){ tryDrop(curBlock.col); e.preventDefault(); }
  }
  if (e.key==='p' || e.key==='P' || e.key==='Escape'){
    if (state==='pause') doResume(); else doPause();
  }
});

// ---------- Кнопки ----------
$('btnPlay').addEventListener('click', function(){ audio(); sfxClick(); hide('scrMenu'); startGame(); });
$('btnPause').addEventListener('click', function(){ sfxClick(); if(state==='pause') doResume(); else doPause(); });
$('btnResume').addEventListener('click', function(){ sfxClick(); doResume(); });
$('btnRestart1').addEventListener('click', function(){ sfxClick(); hide('scrPause'); startGame(); });
$('btnAgain').addEventListener('click', function(){ sfxClick(); hide('scrOver'); startGame(); });
$('btnMenu1').addEventListener('click', function(){ sfxClick(); openMenu(); });
$('btnMenu2').addEventListener('click', function(){ sfxClick(); openMenu(); });
function toggleSound(){ sndOn=!sndOn; storeSet('bp_snd', sndOn?'1':'0'); syncToggles(); sfxClick(); }
function toggleMusic(){ musOn=!musOn; storeSet('bp_mus', musOn?'1':'0'); syncToggles(); syncMusic(); sfxClick(); }
$('tglSound').addEventListener('click', toggleSound);
$('tglSound2').addEventListener('click', toggleSound);
$('tglMusic').addEventListener('click', toggleMusic);
$('tglMusic2').addEventListener('click', toggleMusic);

// ---------- Поделиться ----------
$('btnShare').addEventListener('click', function(){
  sfxClick();
  var text = 'Я набрал(а) ' + score + ' очков в БлокПоп! 🎮 Сможешь побить мой рекорд?';
  var link = TG_BOT_URL || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param ? '' : '');
  if (tg && tg.openTelegramLink){
    try {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link || 'https://t.me') + '&text=' + encodeURIComponent(text));
      return;
    } catch(e){}
  }
  if (navigator.share){ navigator.share({text:text}).catch(function(){}); }
  else if (navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
});

// ---------- Инициализация ----------
storeGet('bp_best', function(v){ best = parseInt(v,10)||0; updateHud(); $('menuBest').textContent='Рекорд: '+best; });
storeGet('bp_snd', function(v){ if(v==='0') sndOn=false; syncToggles(); });
storeGet('bp_mus', function(v){ if(v==='0') musOn=false; syncToggles(); });
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name){
  $('userHello').textContent = 'Привет, ' + tg.initDataUnsafe.user.first_name + '! 👋';
}
resize();
setTimeout(resize, 300);
syncToggles();
requestAnimationFrame(step);
</script>
