<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БлокПоп!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { width:100%; height:100%; overflow:hidden; background:#231a3f; }
  body { font-family:'Arial Rounded MT Bold','Helvetica Rounded',Arial,system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,#2e2154 0%,#231a3f 55%,#1b1430 100%); }
  #hud { width:100%; max-width:520px; display:flex; align-items:center; justify-content:space-between; padding:10px 12px 4px; gap:8px; z-index:5; }
  .pill { background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.14); border-radius:16px; padding:5px 12px; text-align:center; min-width:86px; }
  .pill .lbl { font-size:10px; letter-spacing:1px; color:#b7a8e8; text-transform:uppercase; }
  .pill .val { font-size:19px; font-weight:bold; color:#fff; line-height:1.1; }
  #btnPause { width:44px; height:44px; border-radius:14px; border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.10); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  #cv { display:block; touch-action:none; z-index:1; }
  #btnSkip { position:absolute; z-index:6; width:46px; height:46px; border-radius:15px; border:2px solid rgba(255,255,255,.20);
             background:rgba(255,255,255,.10); color:#fff; font-size:20px; cursor:pointer; font-family:inherit; font-weight:bold; }
  #btnSkip.cool { opacity:.35; }
  #btnSkip:active:not(.cool) { transform:scale(.92); }
  #btnUndo { position:absolute; z-index:6; width:46px; height:46px; border-radius:15px; border:2px solid rgba(255,255,255,.20);
             background:rgba(255,255,255,.10); color:#fff; font-size:19px; cursor:pointer; font-family:inherit; }
  #btnUndo.cool { opacity:.35; }
  #btnUndo:active:not(.cool) { transform:scale(.92); }
  .shopcard { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.10); border-radius:16px; padding:10px 12px; }
  .shopcard.eq { border-color:#ffe14d; }
  .shopcard canvas { flex:none; border-radius:10px; }
  .shopcard .sn { flex:1; text-align:left; }
  .shopcard .sn b { color:#fff; font-size:15px; display:block; }
  .shopcard .sn small { color:#8f7fc9; font-size:12px; }
  .shopcard .sbtn { flex:none; border:none; border-radius:12px; padding:9px 14px; font-family:inherit; font-weight:bold; font-size:13px; color:#fff; cursor:pointer;
                    background:linear-gradient(180deg,#7ee06b,#3fbf4d); box-shadow:0 3px 0 #23803a; }
  .shopcard .sbtn.eqd { background:rgba(255,255,255,.12); box-shadow:none; border:2px solid rgba(255,225,77,.55); color:#ffe14d; }
  .shopcard .sbtn.lock { background:rgba(255,255,255,.10); box-shadow:none; opacity:.75; }
  .shopcard .sbtn:disabled { opacity:.55; }
  body.light .shopcard { background:rgba(46,33,84,.05); border-color:rgba(46,33,84,.1); }
  body.light .shopcard .sn b { color:#2e2154; }
  body.th-space #wrap { background:linear-gradient(180deg,#0b1030 0%,#0a0c22 55%,#05060f 100%); }
  body.th-space.light #wrap { background:linear-gradient(180deg,#141a45 0%,#0e1130 55%,#080a1c 100%); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:50; background:linear-gradient(180deg,#4a3a80,#37295f);
           border:2px solid rgba(255,225,77,.5); border-radius:16px; padding:10px 18px; color:#fff; font-weight:bold; font-size:15px;
           box-shadow:0 6px 18px rgba(0,0,0,.45); animation:toastin .3s ease, toastout .4s ease 3.2s forwards; max-width:86vw; text-align:center; }
  @keyframes toastin { from { transform:translateX(-50%) translateY(30px); opacity:0; } }
  @keyframes toastout { to { transform:translateX(-50%) translateY(20px); opacity:0; } }
  .ic { width:1.05em; height:1.05em; display:inline-block; vertical-align:-0.15em; fill:currentColor; }
  .btn .ic { margin-right:6px; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .spinner { width:.85em; height:.85em; border:2.5px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; display:inline-block; vertical-align:-0.08em; animation:rot .8s linear infinite; }
  .btn:disabled { opacity:.65; }
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:12px; background:rgba(24,16,45,.90); backdrop-filter:blur(6px); padding:20px 24px; text-align:center; overflow-y:auto; }
  .screen::before, .screen::after { content:''; margin:auto; flex:none; }
  .menugrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:300px; }
  .mtile { border:none; cursor:pointer; border-radius:18px; padding:12px 6px 10px; font-size:14px; font-weight:bold; color:#fff; font-family:inherit;
           display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .06s; }
  .mtile .ic { width:1.7em; height:1.7em; margin:0; }
  .mtile:active { transform:translateY(2px); }
  .t-or { background:linear-gradient(180deg,#ff9d4d,#ff6b3d); box-shadow:0 4px 0 #c74a24; }
  .t-rd { background:linear-gradient(180deg,#ff7a7a,#f04444); box-shadow:0 4px 0 #a82525; }
  .t-bl { background:linear-gradient(180deg,#5ec8ff,#3d8bff); box-shadow:0 4px 0 #2456b8; }
  .t-pu { background:linear-gradient(180deg,#c39bff,#8e5cf7); box-shadow:0 4px 0 #5a2ea6; }
  .btn.slim { padding:10px 24px; font-size:16px; box-shadow:0 4px 0 #2456b8; min-width:0; }
  .btn.ghost.slim { padding:8px 18px; font-size:14px; box-shadow:none; }
  .tgl { width:48px; height:48px; border-radius:15px; }
  .hidden { display:none !important; }
  .logo { font-size:min(11vw,48px); font-weight:bold; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.35); letter-spacing:1px; }
  .logo .c1{color:#ff6b6b}.logo .c2{color:#ffb84d}.logo .c3{color:#ffe14d}.logo .c4{color:#6bd96b}.logo .c5{color:#5ec8ff}.logo .c6{color:#c39bff}
  .sub { color:#b7a8e8; font-size:14px; max-width:320px; line-height:1.4; }
  .btn { appearance:none; border:none; cursor:pointer; border-radius:20px; padding:14px 34px; font-size:20px; font-weight:bold; color:#fff; font-family:inherit;
         background:linear-gradient(180deg,#ff9d4d,#ff6b3d); box-shadow:0 5px 0 #c74a24, 0 8px 16px rgba(0,0,0,.35); transition:transform .06s; min-width:220px; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #c74a24; }
  .btn.blue { background:linear-gradient(180deg,#5ec8ff,#3d8bff); box-shadow:0 5px 0 #2456b8, 0 8px 16px rgba(0,0,0,.35); }
  .btn.blue:active { box-shadow:0 2px 0 #2456b8; }
  .btn.green { background:linear-gradient(180deg,#7ee06b,#3fbf4d); box-shadow:0 5px 0 #23803a, 0 8px 16px rgba(0,0,0,.35); }
  .btn.green:active { box-shadow:0 2px 0 #23803a; }
  .btn.ghost { background:rgba(255,255,255,.10); box-shadow:none; border:2px solid rgba(255,255,255,.22); font-size:16px; padding:10px 22px; min-width:0; }
  .toggles { display:flex; gap:12px; }
  .tgl { border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.10); font-size:22px; cursor:pointer; color:#fff; }
  @media (max-height: 640px){
    #scrMenu .sub { display:none; }
    #scrMenu .logo { font-size:32px; }
    #scrMenu { gap:9px; padding:14px 20px; }
    .btn { padding:11px 26px; font-size:18px; }
    .mtile { padding:9px 4px 8px; font-size:13px; }
    .tgl { width:42px; height:42px; }
  }
  .tgl.off { opacity:.38; filter:grayscale(1); }
  .bigscore { font-size:52px; font-weight:bold; color:#ffe14d; text-shadow:0 3px 0 rgba(0,0,0,.4); line-height:1; }
  .overttl { font-size:min(11vw,44px); font-weight:bold; color:#ff6b6b; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  .best { color:#b7a8e8; font-size:16px; }
  .newrec { color:#ffe14d; font-size:18px; font-weight:bold; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.35; } }
  #userHello { color:#8f7fc9; font-size:13px; }
  /* ---------- Светлая тема ---------- */
  body.light { background:#efe9fb; }
  body.light #wrap { background:linear-gradient(180deg,#f6f1ff 0%,#ece5fa 55%,#e3daf5 100%); }
  body.light .pill { background:rgba(46,33,84,.06); border-color:rgba(46,33,84,.12); }
  body.light .pill .lbl { color:#7a68b3; }
  body.light .pill .val { color:#2e2154; }
  body.light #btnPause, body.light #btnSkip, body.light #btnUndo, body.light .tgl { background:rgba(46,33,84,.07); border-color:rgba(46,33,84,.16); color:#2e2154; }
  body.light .screen { background:rgba(243,238,252,.93); }
  body.light .logo { color:#2e2154; text-shadow:0 3px 0 rgba(46,33,84,.15); }
  body.light .sub { color:#5d4d96; }
  body.light .best { color:#6a5aa8; }
  body.light .btn.ghost { background:rgba(46,33,84,.06); border-color:rgba(46,33,84,.2); color:#2e2154; }
  body.light .toptab { background:rgba(46,33,84,.06); border-color:rgba(46,33,84,.16); color:#7a68b3; }
  body.light .toptab.on { color:#2e2154; border-color:#e0a800; background:rgba(255,193,7,.15); }
  body.light .toprow { background:rgba(46,33,84,.05); border-color:rgba(46,33,84,.09); }
  body.light .toprow .nm { color:#2e2154; }
  body.light .toprow .gm { color:#c68400; }
  body.light .toprow.me { border-color:#e0a800; background:rgba(255,193,7,.12); }
  body.light #userHello { color:#8b7cc2; }
  body.light .toast { background:linear-gradient(180deg,#fff,#f0e9ff); color:#2e2154; border-color:rgba(224,168,0,.6); }
  body.light .newrec { color:#c68400; }
  body.light #dailyBadge { border-color:#f6f1ff !important; }
  .toptabs { display:flex; gap:8px; }
  .toptab { border:2px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:#b7a8e8; border-radius:14px; padding:8px 18px; font-size:15px; font-weight:bold; cursor:pointer; font-family:inherit; }
  .toptab.on { color:#fff; border-color:#ffe14d; background:rgba(255,225,77,.12); }
  #topList { width:100%; max-width:360px; display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow-y:auto; }
  .toprow { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.10); border-radius:14px; padding:8px 12px; }
  .toprow.me { border-color:#ffe14d; background:rgba(255,225,77,.10); }
  .toprow .rk { width:28px; text-align:center; font-weight:bold; color:#b7a8e8; flex:none; }
  .toprow .rk.gold { color:#ffe14d; } .toprow .rk.silv { color:#cfd8e3; } .toprow .rk.brnz { color:#e8a06b; }
  .toprow .nm { flex:1; color:#fff; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .toprow .gm { color:#ffe14d; font-weight:bold; flex:none; }
  .toprow .wn { color:#8f7fc9; font-size:12px; flex:none; }
  .toprow .gm.neg { color:#ff8a80; }
  .toprow .gm.zero { color:#8f7fc9; }
  .toprow.click { cursor:pointer; }
  .toprow.click:active { transform:scale(.985); }
  .flairimg { width:20px; height:20px; border-radius:5px; flex:none; vertical-align:-4px; }
  #profCv { width:96px; height:96px; border-radius:20px; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.12); }
  body.light #profCv { background:rgba(46,33,84,.05); border-color:rgba(46,33,84,.10); }
  .gemfall { position:fixed; top:-48px; z-index:40; pointer-events:none; animation:gfall linear forwards; }
  @keyframes gfall { to { transform:translateY(115vh) rotate(600deg); opacity:.9; } }
</style>
</head>

<script>
'use strict';
/* ============================================================
   БлокПоп! — Telegram Mini App edition
   Один самодостаточный файл. Canvas + WebAudio.
   ============================================================ */

// ---------- Telegram Mini App integration ----------
var TG_BOT_URL = 'https://t.me/BlockPopGameBot/play'; // ссылка мини-аппа (кнопка «Поделиться»)
var SCORE_API = 'https://blockpop-bot.dizend.workers.dev/score'; // воркер лидерборда

// Контекст «игры из чата» (Games API): подписанные параметры из URL
var GAME_CTX = null;
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('sig') && q.get('u') && q.get('ts')) {
      GAME_CTX = { u:q.get('u'), im:q.get('im')||'', c:q.get('c')||'', m:q.get('m')||'', ts:q.get('ts'), sig:q.get('sig') };
    }
  } catch(e){}
})();
function submitScore(s){
  if (!GAME_CTX || !SCORE_API) return;
  var el = document.getElementById('scoreSent');
  if (el){ el.textContent = t('sending'); el.classList.remove('hidden'); }
  try {
    fetch(SCORE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // без preflight
      body: JSON.stringify({ score:s, dur: Date.now()-gameStartTs, moves: dropsCount, u:GAME_CTX.u, im:GAME_CTX.im, c:GAME_CTX.c, m:GAME_CTX.m, ts:GAME_CTX.ts, sig:GAME_CTX.sig })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!el) return;
      if (d && d.ok && d.recorded) el.innerHTML = '<svg class="ic"><use href="#i-trophy"/></svg> ' + t('sentToBoard');
      else if (d && d.ok) el.textContent = t('notBeaten');
      else el.classList.add('hidden');
    }).catch(function(){ if (el) el.classList.add('hidden'); });
  } catch(e){ if (el) el.classList.add('hidden'); }
}

// ---------- Кристаллы 💎 ----------
var WORKER_BASE = 'https://blockpop-bot.dizend.workers.dev';
var myBalance = null, bonusState = null, gameStartTs = 0;
function authPayload(){
  if (tg && tg.initData) return { initData: tg.initData };
  if (GAME_CTX) return { u:GAME_CTX.u, im:GAME_CTX.im, c:GAME_CTX.c, m:GAME_CTX.m, ts:GAME_CTX.ts, sig:GAME_CTX.sig };
  return null;
}
function wapi(path, extra, cb){
  var a = authPayload(); if (!a) return;
  var body = {};
  for (var k in a) body[k]=a[k];
  if (extra) for (var k2 in extra) body[k2]=extra[k2];
  try {
    fetch(WORKER_BASE+path, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); }).then(function(d){ if (cb) cb(d); }).catch(function(){ if (cb) cb(null); });
  } catch(e){ if (cb) cb(null); }
}
var IC_GEM = '<svg class="ic"><use href="#i-gem"/></svg>';
var crysShown = -1;
function setCrysDisplay(n, animate){
  var val = $('crysVal');
  if (!animate || crysShown < 0 || crysShown === n){ crysShown = n; val.innerHTML = IC_GEM + ' ' + n; return; }
  var from = crysShown, to = n, t0 = performance.now();
  crysShown = n;
  (function tick(now){
    var k = Math.min(1, (now - t0) / 600);
    var cur = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    val.innerHTML = IC_GEM + ' ' + cur;
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}
var crysLoading = false, crysTimer = null;
function updateCrysUI(animate){
  var pill=$('crysPill'), bb=$('btnBonus');
  if (crysLoading && myBalance===null){
    pill.style.display='';
    $('crysVal').innerHTML = '<span class="spinner"></span>';
    bb.classList.add('hidden');
    return;
  }
  if (myBalance===null){ pill.style.display='none'; bb.classList.add('hidden'); return; }
  pill.style.display='';
  setCrysDisplay(myBalance, animate);
  if (bonusState && bonusState.available){
    bb.innerHTML = '<svg class="ic"><use href="#i-gift"/></svg>' + t('bonusDay') + ' +' + bonusState.amount;
    bb.classList.remove('hidden');
  } else bb.classList.add('hidden');
}
function refreshMe(){
  if (!authPayload()) return;
  if (myBalance === null){
    crysLoading = true; updateCrysUI();
    clearTimeout(crysTimer);
    crysTimer = setTimeout(function(){ if (crysLoading){ crysLoading = false; updateCrysUI(); } }, 8000);
  }
  var mePayload = null;
  if (pendingRef){ mePayload = { ref: pendingRef }; pendingRef = null; }
  wapi('/me', mePayload, function(d){
    crysLoading = false; clearTimeout(crysTimer);
    if (d && d.ok){
      myBalance=d.balance; bonusState=d.bonus;
      if (d.notify !== undefined){ myNotify = d.notify; updNotifTgl(); }
      if (d.skin !== undefined){ applyEquipped(d.skin, d.ftheme); undoCredits = d.undoCredits || 0; }
      if (d.refs){ myRefs = d.refs; updateRefInfo(); }
    }
    updateCrysUI(true);
  });
}
var bonusBusy = false;
$('btnBonus').addEventListener('click', function(){
  if (bonusBusy) return;
  sfxClick();
  bonusBusy = true;
  var bb = $('btnBonus'), oldHtml = bb.innerHTML;
  bb.disabled = true;
  bb.innerHTML = '<span class="spinner"></span> ' + t('getting');
  wapi('/bonus', null, function(d){
    bonusBusy = false; bb.disabled = false;
    if (!d || !d.ok){ bb.innerHTML = oldHtml; return; }
    myBalance = d.balance;
    var msg = $('bonusMsg');
    if (d.claimed){
      bonusState = { available:false };
      sfxCombo(3); haptic('rec');
      if (msg){ msg.innerHTML = t('bonusGot', { n: d.gained, g: IC_GEM, s: d.streak }); msg.classList.remove('hidden'); }
    } else bonusState = d.bonus;
    updateCrysUI(true);
  });
});
var tg = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined) ? window.Telegram.WebApp : null;
var tgReady = false;
if (tg) {
  try {
    tg.ready(); tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#2e2154');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#231a3f');
    tgReady = true;
  } catch(e) {}
}
function tgVer(v){ try { return tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v); } catch(e){ return false; } }

var memStore = {};
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return memStore[k]!==undefined?memStore[k]:null; } }
function lsSet(k,v){ try { localStorage.setItem(k,String(v)); } catch(e){} memStore[k]=String(v); }
function storeGet(k, cb){
  var local = lsGet(k);
  if (tg && tg.CloudStorage && tgVer('6.9')) {
    try {
      tg.CloudStorage.getItem(k, function(err, val){
        if (!err && val !== null && val !== undefined && val !== '') cb(val);
        else cb(local);
      });
      return;
    } catch(e){}
  }
  cb(local);
}

  lsSet(k, v);
  if (tg && tg.CloudStorage && tgVer('6.9')) { try { tg.CloudStorage.setItem(k, String(v), function(){}); } catch(e){} }
}

function haptic(kind){
  if (!vibOn) return;
  if (tg && tg.HapticFeedback && tgVer('6.1')) {
    try {
      if (kind==='drop') tg.HapticFeedback.impactOccurred('light');
      else if (kind==='merge') tg.HapticFeedback.impactOccurred('medium');
      else if (kind==='boom') tg.HapticFeedback.impactOccurred('heavy');
      else if (kind==='over') tg.HapticFeedback.notificationOccurred('error');
      else if (kind==='rec') tg.HapticFeedback.notificationOccurred('success');
      return;
    } catch(e){}
  }
  if (navigator.vibrate) {
    try {
      if (kind==='drop') navigator.vibrate(10);
      else if (kind==='merge') navigator.vibrate(20);
      else if (kind==='boom') navigator.vibrate([30,40,30]);
      else if (kind==='over') navigator.vibrate([60,60,60]);
      else if (kind==='rec') navigator.vibrate([20,30,20,30,60]);
    } catch(e){}
  }
}

var AC = window.AudioContext || window.webkitAudioContext;

function audio(){ if (!actx && AC) { try { actx = new AC(); } catch(e){} } if (actx && actx.state==='suspended') { try{actx.resume();}catch(e){} } return actx; }
function tone(freq, dur, type, vol, when, slide){
  var a = audio(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||'square'; var t = a.currentTime + (when||0);
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.15, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.05);
  } catch(e){}
}

  if(!sndOn) return;
  var base = 260 + Math.min(9,Math.log2(v))*60 + chain*40;

}

function spawnPool(){
  var m = Math.max(maxVal(), 4);
  var vals = [2,2,2,4,4,8];

    var r = mulberry32((duelSeedVal ^ Math.imul(duelIdx, 0x9E3779B1)) >>> 0)();
    duelIdx++;

    return dp[Math.floor(r * dp.length)];

  var sr = Math.random();

// ---------- Слияния ----------
function findMergeGroup(){
  // ищем лучшую группу: связная область одинаковых значений (4-направления), size>=2
  var seen = {};
  var bestG = null;
  for (var c=0;c<COLS;c++) for (var r=0;r<ROWS;r++){
    var b = grid[c][r]; if (!b || b.v < 0) continue;
    var key = c+','+r; if (seen[key]) continue;
    // BFS
    var q=[[c,r]], g=[], v=b.v; seen[key]=1;
    while(q.length){
      var cur=q.pop(), cc=cur[0], rr=cur[1];
      var bb=grid[cc][rr]; if(!bb||bb.v!==v) continue;
      g.push(bb);
      var nb=[[cc-1,rr],[cc+1,rr],[cc,rr-1],[cc,rr+1]];
      for(var i=0;i<nb.length;i++){
        var nc=nb[i][0], nr=nb[i][1];
        if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
        var k2=nc+','+nr; if(seen[k2]) continue;
        var b2=grid[nc][nr];
        if(b2 && b2.v===v){ seen[k2]=1; q.push([nc,nr]); }
      }
    }
    if (g.length>=2){
      if (!bestG || g.length>bestG.length) bestG = g;
    }
  }
  return bestG;
}
function doMerge(group){
  // цель — последний двигавшийся блок группы
  var target = group[0];
  for (var i=1;i<group.length;i++) if (group[i].tick > target.tick) target = group[i];
  var newV = target.v * Math.pow(2, group.length-1);
  combo++;
  if (newV > runMaxTile) runMaxTile = newV;
  if (combo > runMaxCombo) runMaxCombo = combo;
  var gained = newV * combo;
  score += gained;
  // убрать остальных
  for (var j=0;j<group.length;j++){
    var b = group[j];
    if (b===target) continue;
    grid[b.col][b.row] = null;
    blocks.splice(blocks.indexOf(b),1);
    burst(cellX(b.col)+cell/2, b.y+cell/2, colorFor(b.v)[1], 10);
  }
  target.v = newV; target.pop = 1; target.tick = ++moveTick;
  floaters.push({x:cellX(target.col)+cell/2, y:target.y, txt:'+'+gained, t:0, col:'#ffe14d'});
  if (combo>1) floaters.push({x:W/2, y:boardY-10, txt:t('comboX',{n:combo}), t:0, col:'#5ec8ff', big:1});

// ---------- Игровой цикл ----------
var resolveWait = 0;
function step(){
  fcount++;
  var sb = $('btnSkip');
  if (sb){
    var want = (state==='aim') ? 'block' : 'none';
    if (sb.style.display !== want) sb.style.display = want;
  }
  var ub = $('btnUndo');
  if (ub){
    var wantU = (state==='aim' && !duelActive && undoSnap && authPayload()) ? 'block' : 'none';
    if (ub.style.display !== wantU) ub.style.display = wantU;
  }
  // физика падения (замирает на паузе)
  if (state!=='pause') for (var i=0;i<blocks.length;i++){
    var b = blocks[i];
    if (b.y < b.targetY){
      b.vy = (b.vy||0) + 1.6;
      b.y += b.vy;
      if (b.y >= b.targetY){ if (b.vy > 7) b.sq = 1; b.y = b.targetY; b.vy = 0; }
    } else if (b.y > b.targetY){
      b.y = b.targetY; b.vy = 0;
    }
  }
  if (state==='drop'){
    if (dropB && Math.abs(dropB.y-dropB.targetY)<0.5){
      sfxLand();
      if (dropB.v === BOMB){ bombExplode(dropB); }
      dropB = null;
      state = 'resolve';
      resolveWait = 4;
    }
  } else if (state==='resolve'){
    if (allSettled()){
      if (resolveWait>0){ resolveWait--; }
      else {
        if (convertJokers()){ resolveWait = 6; draw(); requestAnimationFrame(step); return; }
        var g = findMergeGroup();
        if (g){ doMerge(g); resolveWait = 7; }
        else {
          combo = 0;
          if (duelActive && (dropsCount >= DUEL_DROPS_C || boardFull())){ duelFinish(); }
          else if (boardFull()){ gameOver(); }
          else { spawnCur(); state='aim'; }
        }
      }
    }
  }
  draw();
  requestAnimationFrame(step);
}

var questState = null;
function questTitle(q){ return LANG === 'en' ? q.tEn : q.tRu; }
function renderQuests(){
  var hdr = $('questsHdr'), list = $('questList');
  if (!hdr || !list) return;
  if (!questState || !questState.quests){ hdr.textContent = ''; list.innerHTML = ''; return; }
  hdr.textContent = t('questsHdr');
  list.innerHTML = '';
  questState.quests.forEach(function(q){
    var div = document.createElement('div');
    div.className = 'toprow';
    var rk = document.createElement('span'); rk.className = 'rk' + (q.done ? ' gold' : '');
    rk.textContent = q.done ? '✓' : (q.n > 1 ? (q.progress + '/' + q.n) : '·');
    if (!q.done && q.n > 1) rk.style.fontSize = '11px';
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = questTitle(q);
    div.appendChild(rk); div.appendChild(nm);
    if (q.done && !q.claimed){
      var btn = document.createElement('button');
      btn.className = 'sbtn';
      btn.innerHTML = t('claimBtn', { r: q.r + ' ' + IC_GEM });
      btn.onclick = (function(qq, bb){ return function(){
        bb.disabled = true; bb.innerHTML = '<span class="spinner"></span>';
        wapi('/quests/claim', { id: qq.id }, function(d){
          if (d && d.ok){
            qq.claimed = true;
            myBalance = d.balance; updateCrysUI(true);
            sfxCombo(3); haptic('rec'); gemRain(10);
          }
          renderQuests();
        });
      }; })(q, btn);
      div.appendChild(btn);
    } else {
      var gm = document.createElement('span'); gm.className = 'gm' + (q.claimed ? ' zero' : '');
      gm.innerHTML = (q.claimed ? '✓ ' : '+') + q.r + ' ' + IC_GEM;
      if (q.claimed) div.style.opacity = '.65';
      div.appendChild(gm);
    }
    list.appendChild(div);
  });
}
function questsSeenKey(){ return 'bp_qseen_' + (questState ? questState.day : ''); }
function checkQuests(showToasts){
  if (!authPayload()) return;
  wapi('/quests', null, function(d){
    if (!d || !d.ok) return;
    questState = d;
    renderQuests();
    var seen = {};
    try { seen = JSON.parse(lsGet('bp_qseen_' + d.day) || '{}'); } catch(e){}
    var newDone = d.quests.filter(function(q){ return q.done && !q.claimed && !seen[q.id]; });
    d.quests.forEach(function(q){ if (q.done) seen[q.id] = 1; });
    lsSet('bp_qseen_' + d.day, JSON.stringify(seen));
    if (showToasts && newDone.length){
      newDone.forEach(function(q, i){
        setTimeout(function(){
          showToast('<svg class="ic"><use href="#i-cal"/></svg> ' + t('questDone', { t: questTitle(q) }));
          sfxCombo(3); haptic('rec');
        }, i * 800);
      });
    }
  });
}

function renderHistory(){

function renderAch(){
  var list = $('topList');
